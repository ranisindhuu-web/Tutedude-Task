<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Interactive Color Grid</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-card">
        <h1 id="greetingHeader">Hello</h1>

        <div class="color-grid">
            <div class="color-box" id="boxRed">red</div>
            <div class="color-box" id="boxBlue">blue</div>
            <div class="color-box" id="boxGreen">green</div>
            <div class="color-box" id="boxYellow">yellow</div>
        </div>

        <div class="interaction-form">
            <input type="text" id="userNameInput" placeholder="Enter your name..." autocomplete="off">
            <button id="greetBtn">Greet Me!</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
