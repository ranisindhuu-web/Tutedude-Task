<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Booking Web App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="logo">🛠️ ServiceApp</div>
        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">Services</a>
            <a href="#">About Us</a>
            <a href="#">Contact Us</a>
        </div>
        <div class="nav-user">
            <span id="username">Rahul Kumar</span>
            <button id="logout-btn">Logout</button>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="main-container">
        
        <!-- Left Section (Cart & Total) -->
        <aside class="left-section">
            <h2>Added Items</h2>
            <div id="cart-container">
                <p id="empty-cart-msg">No items have been added.</p>
                <ul id="cart-list"></ul>
            </div>
            
            <div class="total-section">
                <h3>Total Amount: ₹<span id="total-amount">0</span></h3>
            </div>

            <!-- Booking Form -->
            <div class="booking-form">
                <h3>Book Now</h3>
                <form id="order-form">
                    <input type="text" placeholder="Full Name" required>
                    <input type="email" placeholder="Email" required>
                    <input type="password" placeholder="Password" required>
                    <button type="submit" class="book-btn">Book Now</button>
                </form>
            </div>
        </aside>

        <!-- Right Section (Browse Services) -->
        <main class="right-section">
            <h2>Browse Our Services</h2>
            <p class="desc">Select from our premium and expert services below.</p>
            
            <!-- Services Grid -->
            <div class="services-grid" id="services-grid">
                <!-- JavaScript se dynamic services yahan aayengi -->
            </div>
        </main>

    </div>

    <script src="script.js"></script>
</body>
</html>
